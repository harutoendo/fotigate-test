version: 2.1

jobs:
  config_fortigate:
    machine: true
    resource_class: harutoendo/fotigate-resource

    steps:
      - checkout

      - run:
          name: Setup Python virtual environment
          command: |
            set -euo pipefail

            python3 -m venv .venv
            . .venv/bin/activate

            python -m pip install --upgrade pip
            pip install requests

      - run:
          name: Change FortiGate hostname via API
          command: |
            set -euo pipefail

            . .venv/bin/activate

            python fortigate_config.py \
              --hostname "GP-FortiGate-endo"

workflows:
  config:
    jobs:
      - config_fortigate